<p>
  <a href="{{ "/typophile" | relURL }}">All articles</a>
  <small class="c i">{{ len .Site.RegularPages }}</small>
</p>

<ul id="facets">
  {{ range $name, $taxonomy := .Site.Taxonomies.tags }}
    {{ if ge $taxonomy.Count 5 }}
      <li>
        <a href="{{ printf "/typophile/tags/%s/" ($name | urlize) | relURL }}">{{ $name }}</a>
        <small class="c">{{ $taxonomy.Count }}</small>
      </li>
    {{ end }}
  {{ end }}
</ul>
