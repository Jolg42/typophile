{{ define "main" }}
<div class="container">
  <div class="row">
    <div class="col-md-9">
      <h1>{{ .Title }}</h1>
      <p class="help-block">All tags in the archive</p>

      <div class="row">
        {{ range .Pages }}
          <div class="col-md-4 col-sm-6" style="margin-bottom: 15px;">
            <a href="{{ .Permalink }}" class="btn btn-default btn-block">
              {{ .Title }}
              <span class="badge">{{ len .Pages }}</span>
            </a>
          </div>
        {{ end }}
      </div>

      {{ template "_internal/pagination.html" . }}
    </div>

    <div class="col-md-3">
      <div class="sidebar panel panel-default">
        <div class="panel-heading">Tags</div>
        <div class="panel-body">
          {{ partial "sidebar.html" . }}
        </div>
      </div>
    </div>
  </div>
</div>
{{ end }}
