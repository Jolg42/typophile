<!DOCTYPE html>
<html lang="{{ .Site.LanguageCode }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ block "title" . }}{{ .Site.Title }}{{ with .Title }} | {{ . }}{{ end }}{{ end }}</title>
  <meta name="description" content="{{ .Site.Params.description }}">

  <!-- Bootstrap CSS -->
  <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/3.3.6/css/bootstrap.min.css" integrity="sha384-1q8mTJOASx8j1Au+a5WDVnPi2lkFfwwEAa8hDDdjZlpLegxhjVME1fgjWPGmkzs7" crossorigin="anonymous">
  <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/3.3.6/css/bootstrap-theme.min.css" integrity="sha384-fLW2N01lMqjakBkx3l/M9EahuwpSfeNvV63J5ezn3uZzapT0u7EYsXMjQV+0En5r" crossorigin="anonymous">

  <!-- Pagefind CSS -->
  <link href="{{ "/pagefind/pagefind-ui.css" | relURL }}" rel="stylesheet">

  <style>
    img { max-width: 100%; }
    .hl { background-color: yellow; font-weight: bold; }
    .panel-title a { color: #333; }
    .panel-title a:hover { text-decoration: none; color: #23527c; }

    /* Pagefind custom styling */
    .pagefind-ui__search-input {
      height: 46px;
      font-size: 18px;
    }
    .pagefind-ui {
      margin-bottom: 20px;
    }
  </style>
</head>
<body>

<!-- Header with Search -->
<div class="container page-header">
  {{ block "header" . }}
  <div class="row">
    <div class="col-sm-2">
      <h2><a href="{{ "/" | relURL }}" style="color: inherit; text-decoration: none;">Typophile Archive</a></h2>
    </div>
    <div class="col-sm-10">
      <!-- Pagefind Search UI -->
      <div id="search"></div>
      <p class="help-block">
        <small>Archive of Typophile typography forum (2000-2015). Full-text search across 42,270 articles.</small>
      </p>
    </div>
  </div>
  {{ end }}
</div>

<!-- Main Content -->
{{ block "main" . }}{{ end }}

<!-- Bootstrap JavaScript -->
<script src="https://code.jquery.com/jquery-1.12.4.min.js" integrity="sha384-nvAa0+6Qg9clwYCGGPpDQLVpLNn0fRaROjHqs13t4Ggj3Ez50XnGQqc/r8MhnRDZ" crossorigin="anonymous"></script>
<script src="https://maxcdn.bootstrapcdn.com/bootstrap/3.3.6/js/bootstrap.min.js" integrity="sha384-0mSbJDEHialfmuBBQP6A4Qrprq5OVfW37PRR3j5ELqxss1yVqOtnepnHVP9aJ7xS" crossorigin="anonymous"></script>

<!-- Pagefind JavaScript -->
<script src="{{ "/pagefind/pagefind-ui.js" | relURL }}"></script>
<script>
  window.addEventListener('DOMContentLoaded', (event) => {
    new PagefindUI({
      element: "#search",
      showSubResults: true,
      showImages: false,
      excerptLength: 30
    });
  });
</script>

</body>
</html>
